schema: spec-driven

context: |
  OMS manages multiple source repositories through Git submodules.
  `oms.yaml` declares the repositories. Each source repository resides at `oms/<alias>/`.
  Read `docs/development.md` before choosing build or test commands.
  Read `docs/how-oms-works.md` for Git boundaries and safety conditions.

  Automate safe, deterministic steps. Ask when a choice requires user intent.
  On failure, report the failed operation and the preserved state.
  Give a recovery command that the user can execute.

  Follow `AGENTS.md` for record and conversation languages.

rules:
  proposal:
    - 'Sections: "## Why", "## What Changes", "## Capabilities", "## Impact".'
  specs:
    - Requirements use normative SHALL language.
    - Every requirement has at least one WHEN/THEN scenario.
  tasks:
    - Each implementation step must preserve a successful build and passing tests.
